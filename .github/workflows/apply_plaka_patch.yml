name: Apply vehicle plate support patch

on:
  push:
    paths:
      - '.github/workflows/apply_plaka_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply plate support
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label}')
              return text.replace(old, new, 1)

          screen_path = Path('lib/screens/arac_parca_katalog_sayfasi.dart')
          s = screen_path.read_text(encoding='utf-8')

          # Yeni araç formu: controller
          s = replace_once(
              s,
              "    final sase = TextEditingController();\n    final notlar = TextEditingController();",
              "    final sase = TextEditingController();\n    final plaka = TextEditingController();\n    final notlar = TextEditingController();",
              'new vehicle plate controller',
          )

          # Yeni araç formu: plaka alanı
          s = replace_once(
              s,
              "                SizedBox(\n                  width: 310,\n                  child: TextField(\n                    controller: sahip,",
              "                SizedBox(\n                  width: 200,\n                  child: TextField(\n                    controller: plaka,\n                    textCapitalization: TextCapitalization.characters,\n                    decoration: const InputDecoration(\n                      labelText: 'Plaka',\n                      hintText: '58 ABC 123',\n                      border: OutlineInputBorder(),\n                    ),\n                  ),\n                ),\n                SizedBox(\n                  width: 310,\n                  child: TextField(\n                    controller: sahip,",
              'new vehicle plate field',
          )

          # Yeni araç formundaki tüm controller listelerine plaka ekle.
          # Bu bölüm _aracDetayDuzenle başlamadan önceki alandır.
          before_edit, after_edit = s.split('  Future<void> _aracDetayDuzenle() async {', 1)
          before_edit = before_edit.replace("        sase,\n        notlar,", "        sase,\n        plaka,\n        notlar,")
          before_edit = before_edit.replace("        sase: sase.text,\n        notlar: notlar.text,", "        sase: sase.text,\n        plaka: plaka.text,\n        notlar: notlar.text,")
          s = before_edit + '  Future<void> _aracDetayDuzenle() async {' + after_edit

          # Düzenleme formu: controller
          s = replace_once(
              s,
              "    final sase = TextEditingController(text: _s(arac['sase']));\n    final notlar = TextEditingController(text: _s(arac['notlar']));",
              "    final sase = TextEditingController(text: _s(arac['sase']));\n    final plaka = TextEditingController(text: _s(arac['plaka']));\n    final notlar = TextEditingController(text: _s(arac['notlar']));",
              'edit vehicle plate controller',
          )
          s = replace_once(
              s,
              "      sase,\n      notlar,\n      sahip,",
              "      sase,\n      plaka,\n      notlar,\n      sahip,",
              'edit controllers list',
          )

          # Düzenleme formu: plaka alanı
          s = replace_once(
              s,
              "                  SizedBox(\n                    width: mobil ? genisAlan : 360,\n                    child: TextField(\n                      controller: sahip,",
              "                  SizedBox(\n                    width: mobil ? genisAlan : 220,\n                    child: TextField(\n                      controller: plaka,\n                      textCapitalization: TextCapitalization.characters,\n                      decoration: const InputDecoration(\n                        labelText: 'Plaka',\n                        hintText: '58 ABC 123',\n                        border: OutlineInputBorder(),\n                      ),\n                    ),\n                  ),\n                  SizedBox(\n                    width: mobil ? genisAlan : 360,\n                    child: TextField(\n                      controller: sahip,",
              'edit vehicle plate field',
          )
          s = replace_once(
              s,
              "        sase: sase.text,\n        notlar: notlar.text,\n        aracSahibi: sahip.text,",
              "        sase: sase.text,\n        plaka: plaka.text,\n        notlar: notlar.text,\n        aracSahibi: sahip.text,",
              'edit save plate',
          )

          # Arama ipucu
          s = s.replace(
              "hintText: 'Google tarzı ara: 2005 DOBLO 1.3 DIZEL, AVF PASSAT 2005 veya şase...',",
              "hintText: 'Google tarzı ara: model, motor, şase veya plaka (58 ABC 123)...',",
          )

          # Araç liste kartında plaka göster
          s = replace_once(
              s,
              "              'Motor: ${_s(arac['motor_kodu'])} • Şase: ${_s(arac['sase'])}',",
              "              'Motor: ${_s(arac['motor_kodu'])} • Plaka: ${_s(arac['plaka']).isEmpty ? '-' : _s(arac['plaka'])} • Şase: ${_s(arac['sase'])}',",
              'vehicle list plate',
          )

          # Detay üst bilgi kartına Plaka ekle
          s = replace_once(
              s,
              "                _bilgi('Yakıt', _s(arac['yakit'])),\n                _kopyalanabilirBilgi('Şase', _s(arac['sase']), 'Şase'),",
              "                _bilgi('Yakıt', _s(arac['yakit'])),\n                _kopyalanabilirBilgi('Plaka', _s(arac['plaka']), 'Plaka'),\n                _kopyalanabilirBilgi('Şase', _s(arac['sase']), 'Şase'),",
              'detail plate info',
          )

          screen_path.write_text(s, encoding='utf-8')

          service_path = Path('lib/services/arac_katalog_service.dart')
          t = service_path.read_text(encoding='utf-8')

          # Plaka normalizasyonu
          t = replace_once(
              t,
              "  static bool _aractanSilinmis(Map<String, dynamic> row) {",
              "  static String _plakaNormalize(String value) {\n    final temiz = value.trim().toUpperCase();\n    if (temiz.isEmpty) return '';\n    return temiz.replaceAll(RegExp(r'\\s+'), ' ');\n  }\n\n  static String _plakaKompakt(dynamic value) =>\n      _norm(_cell(value)).replaceAll('_', '');\n\n  static bool _aractanSilinmis(Map<String, dynamic> row) {",
              'plate normalization helper',
          )

          # aracEkle parametresi ve kayıt
          t = replace_once(
              t,
              "    String sase = '',\n    String notlar = '',",
              "    String sase = '',\n    String plaka = '',\n    String notlar = '',",
              'aracEkle plate parameter',
          )
          t = replace_once(
              t,
              "          'sase': sase.trim().toUpperCase(),\n          'notlar': notlar.trim(),",
              "          'sase': sase.trim().toUpperCase(),\n          'plaka': _plakaNormalize(plaka),\n          'notlar': notlar.trim(),",
              'aracEkle plate data',
          )

          # aracGuncelle parametresi ve kayıt (ikinci eşleşme parametre için)
          marker = '  static Future<Map<String, dynamic>> aracGuncelle({'
          left, right = t.split(marker, 1)
          right = right.replace("    String sase = '',\n    String notlar = '',", "    String sase = '',\n    String plaka = '',\n    String notlar = '',", 1)
          right = right.replace("          'sase': sase.trim().toUpperCase(),\n          'notlar': notlar.trim(),", "          'sase': sase.trim().toUpperCase(),\n          'plaka': _plakaNormalize(plaka),\n          'notlar': notlar.trim(),", 1)
          t = left + marker + right

          # Şase sorgusunda plaka da dönsün
          t = t.replace(
              ".select('arac_id,uretici,model,yil,yillar,motor,motor_kodu,sase')",
              ".select('arac_id,uretici,model,yil,yillar,motor,motor_kodu,sase,plaka')",
          )

          # Excel/CSV içe aktarmada PLAKA desteği
          t = replace_once(
              t,
              "        'SASE': getVal(row, 'SASE'),\n        'NOT': getVal(row, 'NOT'),",
              "        'SASE': getVal(row, 'SASE'),\n        'PLAKA': getVal(row, 'PLAKA'),\n        'NOT': getVal(row, 'NOT'),",
              'import plate input',
          )
          # iceAktar upsert içindeki doğru blok
          import_marker = '  static Future<AracKatalogImportSonuc> iceAktar('
          left, right = t.split(import_marker, 1)
          right = right.replace("            'sase': rec['SASE'],\n            'notlar': rec['NOT'],", "            'sase': rec['SASE'],\n            'plaka': _plakaNormalize(rec['PLAKA'] ?? ''),\n            'notlar': rec['NOT'],", 1)
          t = left + import_marker + right

          # Arama puanı: plakaya en yüksek önceliklerden biri
          t = replace_once(
              t,
              "    final sase = _norm(_cell(x['sase']));\n    final motorKodu = _norm(_cell(x['motor_kodu']));",
              "    final sase = _norm(_cell(x['sase']));\n    final plaka = _plakaKompakt(x['plaka']);\n    final motorKodu = _norm(_cell(x['motor_kodu']));",
              'search score plate variable',
          )
          t = replace_once(
              t,
              "    for (final k in kelimeler) {\n      if (sase == k) puan += 1000;",
              "    for (final k in kelimeler) {\n      final kompaktK = k.replaceAll('_', '');\n      if (plaka.isNotEmpty && plaka == kompaktK) puan += 1200;\n      if (sase == k) puan += 1000;",
              'search score plate exact',
          )

          # Arama havuzuna plaka + boşluksuz plaka ekle
          t = replace_once(
              t,
              "          x['motor_kodu'],\n          x['sase'],\n          x['notlar'],",
              "          x['motor_kodu'],\n          x['sase'],\n          x['plaka'],\n          _plakaKompakt(x['plaka']),\n          x['notlar'],",
              'search haystack plate',
          )

          service_path.write_text(t, encoding='utf-8')

          sql_path = Path('supabase/PRO_ERP_CATALOG_PLAKA_FIX_2_5_30.sql')
          sql_path.write_text("""-- PRO ERP 2.5.30 - Araç kataloğu plaka desteği\n-- Bir kez Supabase SQL Editor'da çalıştırın.\n\nalter table if exists public.erp_arac_katalog_araclar\n  add column if not exists plaka text;\n\nupdate public.erp_arac_katalog_araclar\nset plaka = upper(regexp_replace(trim(plaka), '\\s+', ' ', 'g'))\nwhere plaka is not null and trim(plaka) <> '';\n\ncreate index if not exists idx_erp_arac_katalog_araclar_plaka\n  on public.erp_arac_katalog_araclar ((upper(regexp_replace(coalesce(plaka, ''), '[^A-Za-z0-9]', '', 'g'))));\n\ncomment on column public.erp_arac_katalog_araclar.plaka\n  is 'Araç plakası; araç kataloğu detayında gösterilir ve aramada kullanılır.';\n""", encoding='utf-8')
          PY

          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/arac_parca_katalog_sayfasi.dart lib/services/arac_katalog_service.dart supabase/PRO_ERP_CATALOG_PLAKA_FIX_2_5_30.sql
          if git diff --cached --quiet; then
            echo "Plate support already applied."
            exit 0
          fi
          git commit -m "Araç kataloğuna plaka alanı ve plaka araması ekle"
          git push origin HEAD:main
