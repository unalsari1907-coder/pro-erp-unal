name: PRO ERP 2.5.30 Mobile UI Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ui-fix-2530.yml'

permissions:
  contents: write

jobs:
  apply-mobile-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile UI fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # --------------------------------------------------
          # 1) CARI KARTLARI - mobil ozetler tek satir
          # --------------------------------------------------
          p = Path('lib/screens/cariler_sayfasi.dart')
          s = p.read_text(encoding='utf-8')

          anchor = "  Widget _cariKarti(Map<String, dynamic> cari) {"
          helper = r'''  Widget _mobilOzetKarti({
            required String baslik,
            required String deger,
            required IconData ikon,
            required Color renk,
          }) {
            return Expanded(
              child: Card(
                margin: EdgeInsets.zero,
                elevation: 1,
                shape: RoundedRectangleBorder(
                  borderRadius: BorderRadius.circular(10),
                ),
                child: Padding(
                  padding: const EdgeInsets.symmetric(
                    horizontal: 7,
                    vertical: 8,
                  ),
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(ikon, color: renk, size: 17),
                      const SizedBox(width: 4),
                      Flexible(
                        child: RichText(
                          maxLines: 1,
                          overflow: TextOverflow.ellipsis,
                          text: TextSpan(
                            style: const TextStyle(
                              fontSize: 10.5,
                              color: Colors.grey,
                            ),
                            children: [
                              TextSpan(text: '$baslik '),
                              TextSpan(
                                text: deger,
                                style: TextStyle(
                                  color: renk,
                                  fontSize: 11.5,
                                  fontWeight: FontWeight.w900,
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              ),
            );
          }

'''
          if '_mobilOzetKarti({' not in s:
              if anchor not in s:
                  raise SystemExit('Cari helper anchor bulunamadi')
              s = s.replace(anchor, helper + anchor, 1)

          old = r'''          Padding(
            padding: const EdgeInsets.fromLTRB(12, 10, 12, 4),
            child: MobilYatayRow(
              mobilDikey: true,
              minWidth: 760,
              children: [
                _ozetKarti(
                  baslik: 'Aktif Cari',
                  deger: _aktifCariSayisi.toString(),
                  ikon: Icons.people,
                  renk: Colors.blue,
                ),
                const SizedBox(width: 8),
                _ozetKarti(
                  baslik: 'ALACAKLIYIZ',
                  deger: _para(_toplamCariAlacagimiz),
                  ikon: Icons.trending_up,
                  renk: Colors.green,
                ),
                const SizedBox(width: 8),
                _ozetKarti(
                  baslik: 'BORÇLUYUZ',
                  deger: _para(_toplamCariBorcumuz),
                  ikon: Icons.trending_down,
                  renk: Colors.red,
                ),
              ],
            ),
          ),'''
          new = r'''          Padding(
            padding: EdgeInsets.fromLTRB(
              mobil ? 8 : 12,
              mobil ? 6 : 10,
              mobil ? 8 : 12,
              4,
            ),
            child: mobil
                ? Row(
                    children: [
                      _mobilOzetKarti(
                        baslik: 'Aktif Cari',
                        deger: _aktifCariSayisi.toString(),
                        ikon: Icons.people,
                        renk: Colors.blue,
                      ),
                      const SizedBox(width: 5),
                      _mobilOzetKarti(
                        baslik: 'Alacak',
                        deger: _para(_toplamCariAlacagimiz),
                        ikon: Icons.trending_up,
                        renk: Colors.green,
                      ),
                      const SizedBox(width: 5),
                      _mobilOzetKarti(
                        baslik: 'Borç',
                        deger: _para(_toplamCariBorcumuz),
                        ikon: Icons.trending_down,
                        renk: Colors.red,
                      ),
                    ],
                  )
                : MobilYatayRow(
                    mobilDikey: true,
                    minWidth: 760,
                    children: [
                      _ozetKarti(
                        baslik: 'Aktif Cari',
                        deger: _aktifCariSayisi.toString(),
                        ikon: Icons.people,
                        renk: Colors.blue,
                      ),
                      const SizedBox(width: 8),
                      _ozetKarti(
                        baslik: 'ALACAKLIYIZ',
                        deger: _para(_toplamCariAlacagimiz),
                        ikon: Icons.trending_up,
                        renk: Colors.green,
                      ),
                      const SizedBox(width: 8),
                      _ozetKarti(
                        baslik: 'BORÇLUYUZ',
                        deger: _para(_toplamCariBorcumuz),
                        ikon: Icons.trending_down,
                        renk: Colors.red,
                      ),
                    ],
                  ),
          ),'''
          if old not in s:
              raise SystemExit('Cari mobil ozet blogu bulunamadi')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # --------------------------------------------------
          # 2) SATIS FATURASI - mobilde stok arama alani gorunsun
          # --------------------------------------------------
          p = Path('lib/screens/satis_sayfasi.dart')
          s = p.read_text(encoding='utf-8')

          anchor = "  Widget _darDuzen() {"
          helpers = r'''  Widget _mobilKurumsalFaturaBasligi() {
            return Container(
              margin: const EdgeInsets.fromLTRB(8, 6, 8, 2),
              padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
              decoration: BoxDecoration(
                color: Colors.white,
                border: Border.all(color: Colors.blueGrey.shade200),
                borderRadius: BorderRadius.circular(10),
              ),
              child: Row(
                children: [
                  Container(
                    width: 36,
                    height: 36,
                    alignment: Alignment.center,
                    decoration: BoxDecoration(
                      color: Colors.blue.shade50,
                      borderRadius: BorderRadius.circular(8),
                    ),
                    child: Icon(
                      Icons.receipt_long_rounded,
                      color: Colors.blue.shade800,
                      size: 21,
                    ),
                  ),
                  const SizedBox(width: 9),
                  const Expanded(
                    child: Text(
                      'ÜNAL YEDEK PARÇA',
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: TextStyle(
                        fontSize: 14,
                        fontWeight: FontWeight.w900,
                      ),
                    ),
                  ),
                  Text(
                    'SATIŞ FATURASI',
                    style: TextStyle(
                      fontSize: 12.5,
                      fontWeight: FontWeight.w900,
                      color: Colors.blueGrey.shade900,
                    ),
                  ),
                ],
              ),
            );
          }

          Widget _mobilAltBolum() {
            Widget ozet(String baslik, double deger, Color renk) {
              return Expanded(
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 5, vertical: 7),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    border: Border.all(color: const Color(0xFFD9DCE3)),
                    borderRadius: BorderRadius.circular(8),
                  ),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        baslik,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        style: const TextStyle(
                          fontSize: 9.5,
                          color: Colors.grey,
                        ),
                      ),
                      const SizedBox(height: 2),
                      Text(
                        '${deger.toStringAsFixed(2)} ₺',
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        style: TextStyle(
                          color: renk,
                          fontSize: 11.5,
                          fontWeight: FontWeight.w900,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            return Container(
              color: Colors.white,
              padding: const EdgeInsets.fromLTRB(8, 5, 8, 7),
              child: Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  Row(
                    children: [
                      ozet('Ara Toplam', _araToplam, Colors.blue.shade700),
                      const SizedBox(width: 5),
                      ozet('İskonto', _toplamIndirim, Colors.blue.shade700),
                      const SizedBox(width: 5),
                      ozet('KDV', _toplamKdv, Colors.blue.shade700),
                      const SizedBox(width: 5),
                      ozet('Genel', _genelToplam, Colors.green.shade700),
                    ],
                  ),
                  const SizedBox(height: 6),
                  Row(
                    children: [
                      Expanded(
                        child: OutlinedButton.icon(
                          onPressed: _kaydediliyor ? null : _formuTemizle,
                          icon: const Icon(Icons.delete_sweep, size: 18),
                          label: const Text('Temizle'),
                        ),
                      ),
                      const SizedBox(width: 8),
                      Expanded(
                        flex: 2,
                        child: ElevatedButton.icon(
                          onPressed: _kaydediliyor ? null : _satisiKaydet,
                          icon: _kaydediliyor
                              ? const SizedBox(
                                  width: 16,
                                  height: 16,
                                  child: CircularProgressIndicator(strokeWidth: 2),
                                )
                              : const Icon(Icons.check_circle, size: 18),
                          label: Text(
                            _kaydediliyor
                                ? 'Kaydediliyor...'
                                : _irsaliyeAktarModu
                                    ? 'İrsaliyeleri Faturala'
                                    : 'Satışı Tamamla',
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                          ),
                        ),
                      ),
                    ],
                  ),
                ],
              ),
            );
          }

'''
          if '_mobilKurumsalFaturaBasligi()' not in s:
              if anchor not in s:
                  raise SystemExit('Satis mobil helper anchor bulunamadi')
              s = s.replace(anchor, helpers + anchor, 1)

          old = r'''  Widget _darDuzen() {
            return Column(
              children: [
                _kurumsalFaturaBasligi(),
                _ustBilgiler(),
                Padding(
                  padding: const EdgeInsets.fromLTRB(8, 4, 8, 0),
                  child: SegmentedButton<int>(
                    segments: [
                      const ButtonSegment(
                        value: 0,
                        icon: Icon(Icons.search),
                        label: Text('Ürün Ara'),
                      ),
                      ButtonSegment(
                        value: 1,
                        icon: const Icon(Icons.shopping_cart),
                        label: Text('Sepet (${_sepet.length})'),
                      ),
                    ],
                    selected: {_aktifPanel},
                    onSelectionChanged: (secim) {
                      setState(() => _aktifPanel = secim.first);
                    },
                  ),
                ),
                Expanded(
                  child: IndexedStack(
                    index: _aktifPanel,
                    children: [
                      _aramaPaneli(),
                      _sepetPaneli(),
                    ],
                  ),
                ),
                _altBolum(),
              ],
            );
          }'''
          new = r'''  Widget _darDuzen() {
            return Column(
              children: [
                _mobilKurumsalFaturaBasligi(),
                Card(
                  margin: const EdgeInsets.fromLTRB(8, 4, 8, 2),
                  elevation: 0,
                  child: ExpansionTile(
                    initiallyExpanded: false,
                    tilePadding: const EdgeInsets.symmetric(horizontal: 12),
                    childrenPadding: const EdgeInsets.fromLTRB(4, 0, 4, 6),
                    leading: const Icon(Icons.tune_rounded),
                    title: const Text(
                      'Belge Bilgileri',
                      style: TextStyle(fontWeight: FontWeight.w800),
                    ),
                    subtitle: Text(
                      '${_seciliCariAdi()} • $_odemeTipi',
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                    ),
                    children: [
                      ConstrainedBox(
                        constraints: const BoxConstraints(maxHeight: 360),
                        child: SingleChildScrollView(
                          child: _ustBilgiler(),
                        ),
                      ),
                    ],
                  ),
                ),
                Padding(
                  padding: const EdgeInsets.fromLTRB(8, 4, 8, 0),
                  child: SizedBox(
                    width: double.infinity,
                    child: SegmentedButton<int>(
                      segments: [
                        const ButtonSegment(
                          value: 0,
                          icon: Icon(Icons.search),
                          label: Text('Ürün Ara'),
                        ),
                        ButtonSegment(
                          value: 1,
                          icon: const Icon(Icons.shopping_cart),
                          label: Text('Sepet (${_sepet.length})'),
                        ),
                      ],
                      selected: {_aktifPanel},
                      onSelectionChanged: (secim) {
                        setState(() => _aktifPanel = secim.first);
                      },
                    ),
                  ),
                ),
                Expanded(
                  child: IndexedStack(
                    index: _aktifPanel,
                    children: [
                      _aramaPaneli(),
                      _sepetPaneli(),
                    ],
                  ),
                ),
                _mobilAltBolum(),
              ],
            );
          }'''
          if old not in s:
              raise SystemExit('Satis dar duzen blogu bulunamadi')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          print('Mobil cari + satis faturasi duzeltmeleri uygulandi.')
          PY

      - name: Commit mobile fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/cariler_sayfasi.dart lib/screens/satis_sayfasi.dart
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "Fix mobile cari summary and sales invoice stock area"
          git push origin main
