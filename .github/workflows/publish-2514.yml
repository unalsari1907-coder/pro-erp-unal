name: Publish PRO ERP 2.5.14

on:
  push:
    paths:
      - '.github/workflows/publish-2514.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct 2.5.13 source baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proerp-src
          : > /tmp/proerp-2513.tar.gz
          for f in part-00 part-01 part-02 part-03; do
            git show 57f0ea4f4bfb14fddf86a580e15076377699101c:.release/$f >> /tmp/proerp-2513.tar.gz
          done
          tar -xzf /tmp/proerp-2513.tar.gz -C /tmp/proerp-src

      - name: Apply PRO ERP 2.5.14 mobile patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/proerp-2514-patch.tar.gz
          for f in \
            .release2514/patch-00.b64 \
            .release2514/patch-01.b64 \
            .release2514/patch-02a.b64 .release2514/patch-02b.b64 \
            .release2514/patch-03a.b64 .release2514/patch-03b.b64 \
            .release2514/patch-04a.b64 .release2514/patch-04b.b64 \
            .release2514/patch-05.b64; do
            base64 -d "$f" >> /tmp/proerp-2514-patch.tar.gz
          done
          tar -xzf /tmp/proerp-2514-patch.tar.gz -C /tmp/proerp-src
          grep -q "version: 2.5.14+2026081502" /tmp/proerp-src/pubspec.yaml
          grep -q "version = '2.5.14'" /tmp/proerp-src/lib/app_config.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: /tmp/proerp-src
        run: flutter pub get

      - name: Analyze
        working-directory: /tmp/proerp-src
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build web release
        working-directory: /tmp/proerp-src
        run: flutter build web --release

      - name: Publish compiled web to main
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/proerp-src/build/web/. .
          printf '%s\n' 'PRO ERP 2.5.14 mobile-compatible production build.' > DEPLOYMENT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy PRO ERP 2.5.14 mobile build' || exit 0
          git push origin HEAD:main
