name: Build and deploy PRO ERP 2.5.13

on:
  push:
    branches: [main]
    paths:
      - '.release/**'
      - '.github/workflows/build-pro-erp-2.5.13.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message != 'Deploy PRO ERP 2.5.13'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          cat .release/part-* > /tmp/pro-erp-source.tar.gz
          mkdir source
          tar -xzf /tmp/pro-erp-source.tar.gz -C source
          test "$(sha256sum /tmp/pro-erp-source.tar.gz | cut -d' ' -f1)" = "55e4733281f24bedcf47cdde9b831f5426cec61aa1173e0f1ead4581a98c2c62"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: source
        run: flutter pub get

      - name: Build web release
        working-directory: source
        run: flutter build web --release --base-href "/pro-erp-unal/" --no-wasm-dry-run

      - name: Publish compiled site
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name source -exec rm -rf {} +
          cp -a source/build/web/. .
          rm -rf source .release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy PRO ERP 2.5.13"
          git push
