name: PRO ERP 2.5.23 FINAL

on:
  push:
    branches: [main]
    paths:
      - '.release2523/**'
      - '.github/workflows/pro-erp-2.5.23.yml'
  pull_request:
    branches: [main]
    paths:
      - '.release2523/**'
      - '.github/workflows/pro-erp-2.5.23.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified 2.5.21 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/proerp-src
          mkdir -p /tmp/proerp-src
          : > /tmp/proerp-2513.tar.gz
          for f in part-00 part-01 part-02 part-03; do git show 57f0ea4f4bfb14fddf86a580e15076377699101c:.release/$f >> /tmp/proerp-2513.tar.gz; done
          tar -xzf /tmp/proerp-2513.tar.gz -C /tmp/proerp-src
          : > /tmp/proerp-2514-patch.tar.gz
          for f in patch-00.b64 patch-01.b64 patch-02a.b64 patch-02b.b64 patch-03a.b64 patch-03b.b64 patch-04a.b64 patch-04b.b64 patch-05.b64; do git show e0df05edf4fc15a76eb5930944d9dee50c345161:.release2514/$f | base64 -d >> /tmp/proerp-2514-patch.tar.gz; done
          tar -xzf /tmp/proerp-2514-patch.tar.gz -C /tmp/proerp-src
          git show 61e0931c4ea861397c97162345530265dcc58052:.release2520/apply_2520.py > /tmp/apply_2520.py
          python3 /tmp/apply_2520.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/proerp-src/lib/services/arac_katalog_service.dart')
          s=p.read_text(encoding='utf-8').replace('_parcaAdiStandartla(parcaAdi, kategoriKodu: eskiKod)','_parcaAdiStandartla(parcaAdi)',1)
          p.write_text(s,encoding='utf-8')
          PY
          base64 -d .release2521/apply_2521.py.gz.b64 | gzip -d > /tmp/apply_2521.py
          cd /tmp/proerp-src
          python3 /tmp/apply_2521.py

      - name: Apply 2.5.22 catalog final
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/proerp-src
          patch -p1 < "$GITHUB_WORKSPACE/.release2522/arac_katalog_service.patch"
          patch -p1 < "$GITHUB_WORKSPACE/.release2522/arac_parca_katalog_sayfasi.patch"
          cp "$GITHUB_WORKSPACE/.release2522/PRO_ERP_KATALOG_RPC_MOTOR.sql" ./PRO_ERP_KATALOG_RPC_MOTOR.sql

      - name: Apply 2.5.23 final updates
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/proerp-src
          patch -p1 < "$GITHUB_WORKSPACE/.release2523/cariler_sayfasi.patch"
          patch -p1 < "$GITHUB_WORKSPACE/.release2523/kasa_banka_sayfasi.patch"
          patch -p1 < "$GITHUB_WORKSPACE/.release2523/excel_stok_id_otomatik.patch"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: /tmp/proerp-src
        run: flutter pub get

      - name: Analyze
        working-directory: /tmp/proerp-src
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Web
        working-directory: /tmp/proerp-src
        run: flutter build web --release --base-href /pro-erp-unal/

      - name: Verify final rules
        shell: bash
        run: |
          set -euxo pipefail
          test -f /tmp/proerp-src/build/web/index.html
          test -f /tmp/proerp-src/build/web/main.dart.js
          grep -q "bakiye.abs()" /tmp/proerp-src/lib/screens/cariler_sayfasi.dart
          grep -q "Cari Güncel Bakiye" /tmp/proerp-src/lib/screens/kasa_banka_sayfasi.dart
          grep -q "ALACAKLIYIZ" /tmp/proerp-src/lib/screens/cariler_sayfasi.dart
          grep -q "BORÇLUYUZ" /tmp/proerp-src/lib/screens/cariler_sayfasi.dart
          grep -q 'erp_katalog_parca_kalici_sil' /tmp/proerp-src/lib/services/arac_katalog_service.dart
          grep -q "x.remove('stok_id')" /tmp/proerp-src/lib/services/excel_service.dart
          grep -q "grup_kodu" /tmp/proerp-src/lib/services/excel_service.dart
          grep -q "resim_link" /tmp/proerp-src/lib/services/excel_service.dart
          grep -q "from('stoklar').insert" /tmp/proerp-src/lib/services/excel_service.dart
          grep -q "from('stoklar').update" /tmp/proerp-src/lib/services/excel_service.dart

      - name: Prepare full package
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/PRO-ERP-2.5.23
          mkdir -p /tmp/PRO-ERP-2.5.23
          rsync -a --exclude='.git' --exclude='build' --exclude='.dart_tool' /tmp/proerp-src/ /tmp/PRO-ERP-2.5.23/
          cp -r /tmp/proerp-src/build/web /tmp/PRO-ERP-2.5.23/build-web
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/PRO-ERP-2.5.23-TAM-SURUM.zip" PRO-ERP-2.5.23
          unzip -t "$GITHUB_WORKSPACE/PRO-ERP-2.5.23-TAM-SURUM.zip"

      - name: Upload full package
        uses: actions/upload-artifact@v4
        with:
          name: PRO-ERP-2.5.23-TAM-SURUM
          path: PRO-ERP-2.5.23-TAM-SURUM.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish compiled web to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .release2520 ! -name .release2521 ! -name .release2522 ! -name .release2523 -exec rm -rf {} +
          cp -a /tmp/proerp-src/build/web/. .
          cp /tmp/proerp-src/PRO_ERP_KATALOG_RPC_MOTOR.sql ./PRO_ERP_KATALOG_RPC_MOTOR.sql
          printf '%s\n' 'PRO ERP 2.5.23 TAM SURUM - catalog final, cari green/red absolute balances, selected cari balance, automatic Excel stok_id, grup_kodu and resim_link Excel import.' > DEPLOYMENT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy PRO ERP 2.5.23 TAM SURUM' || exit 0
          git push origin HEAD:main
