name: Apply PRO ERP 2.5.31 finance and shortcuts v3

on:
  push:
    paths:
      - '.github/workflows/apply_finance_shortcuts_2531_v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected 2.5.31 patch
        shell: bash
        run: |
          echo '  ' | base64 -d > /tmp/pro_erp_2531_patch.py
          python3 /tmp/pro_erp_2531_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/kasa_banka_sayfasi.dart lib/screens/dashboard_sayfasi.dart supabase/PRO_ERP_FINANS_KK_LIMIT_2_5_31.sql
          if git diff --cached --quiet; then
            echo "Already applied."
            exit 0
          fi
          git commit -m "Apply card limits instant cash refresh and keyboard shortcuts"
          git push origin HEAD:main
