name: Apply PRO ERP 2.5.30 Mobile Repairs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-repair-2530.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair script
        run: python3 tools/pro_erp_2530_mobile_fix.py

      - name: Commit repaired sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/cariler_sayfasi.dart lib/screens/satis_sayfasi.dart lib/screens/sayim_screen.dart lib/screens/kasa_gun_sonu_sayfasi.dart lib/screens/makbuzlar_sayfasi.dart lib/widgets/mobil_uyum.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Fix PRO ERP 2.5.30 mobile overflow and layout issues"
          git push origin main
