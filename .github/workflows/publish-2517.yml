name: Publish PRO ERP 2.5.17

on:
  push:
    paths:
      - '.github/workflows/publish-2517.yml'
      - '.release2517/catalog-fix.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct 2.5.13 source baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/proerp-src
          mkdir -p /tmp/proerp-src
          : > /tmp/proerp-2513.tar.gz
          for f in part-00 part-01 part-02 part-03; do
            git show 57f0ea4f4bfb14fddf86a580e15076377699101c:.release/$f >> /tmp/proerp-2513.tar.gz
          done
          tar -xzf /tmp/proerp-2513.tar.gz -C /tmp/proerp-src

      - name: Apply PRO ERP 2.5.14 mobile source patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/proerp-2514-patch.tar.gz
          for f in patch-00.b64 patch-01.b64 patch-02a.b64 patch-02b.b64 patch-03a.b64 patch-03b.b64 patch-04a.b64 patch-04b.b64 patch-05.b64; do
            git show e0df05edf4fc15a76eb5930944d9dee50c345161:.release2514/$f | base64 -d >> /tmp/proerp-2514-patch.tar.gz
          done
          tar -xzf /tmp/proerp-2514-patch.tar.gz -C /tmp/proerp-src

      - name: Apply PRO ERP 2.5.17 cumulative catalog patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/.release2517/catalog-fix.patch.gz.b64" | gzip -dc > /tmp/catalog-2517.patch
          patch -d /tmp/proerp-src -p1 < /tmp/catalog-2517.patch
          grep -q "version: 2.5.17+2026081701" /tmp/proerp-src/pubspec.yaml
          grep -q "version = '2.5.17'" /tmp/proerp-src/lib/app_config.dart
          grep -q "kategoriDurumRengi" /tmp/proerp-src/lib/screens/arac_parca_katalog_sayfasi.dart
          grep -q "kategoriTamamlanan" /tmp/proerp-src/lib/screens/arac_parca_katalog_sayfasi.dart
          grep -q "_parcaAdiStandartla" /tmp/proerp-src/lib/services/arac_katalog_service.dart
          grep -q "R/L" /tmp/proerp-src/lib/services/arac_katalog_service.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: /tmp/proerp-src
        run: flutter pub get

      - name: Analyze
        working-directory: /tmp/proerp-src
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build web release
        working-directory: /tmp/proerp-src
        run: flutter build web --release --base-href /pro-erp-unal/

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/proerp-src/build/web/index.html
          test -f /tmp/proerp-src/build/web/main.dart.js
          grep -q '<base href="/pro-erp-unal/">' /tmp/proerp-src/build/web/index.html

      - name: Publish compiled web to main
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/proerp-src/build/web/. .
          printf '%s\n' 'PRO ERP 2.5.17 production build - persistent R/L edits, uppercase ASCII catalog names, per-OEM stock lookup, category OEM completion colors.' > DEPLOYMENT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy PRO ERP 2.5.17 catalog completion fixes' || exit 0
          git push origin HEAD:main
