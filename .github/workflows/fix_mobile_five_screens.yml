                      DropdownMenuItem(value: 'Havale', child: Text('Havale / EFT')),
                      DropdownMenuItem(value: 'Veresiye', child: Text('Veresiye')),
                    ],
                    onChanged: _odemeTipiDegisti,
                  ),
                ),
                SizedBox(
                  width: alan(210),
                  child: DropdownButtonFormField<int>(
                    isExpanded: true,
                    value: _veresiyeMi ? null : _kasaId,
                    decoration: InputDecoration(
                      labelText: 'Kasa / Banka',
                      hintText: _veresiyeMi ? 'Veresiyede kullanılmaz' : null,
                      border: const OutlineInputBorder(),
                    ),
                    items: _kasalar.map((kasa) => DropdownMenuItem<int>(
                      value: int.tryParse(kasa['kasa_id'].toString()),
