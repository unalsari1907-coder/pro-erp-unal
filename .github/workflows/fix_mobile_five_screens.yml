                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                      ),
                    )),
                    const SizedBox(width: 8),
                    SizedBox(width: 115, child: DropdownButtonFormField<String>(
                      value: _durumFiltresi,
                      isExpanded: true,
                      decoration: const InputDecoration(labelText: 'Durum', border: OutlineInputBorder()),
                      items: const [
                        DropdownMenuItem(value: 'TÜMÜ', child: Text('Tümü')),
                        DropdownMenuItem(value: 'AKTİF', child: Text('Aktif')),
                        DropdownMenuItem(value: 'İPTAL', child: Text('İptal')),
                      ],
                      onChanged: (deger) { if (deger == null) return; setState(() => _durumFiltresi = deger); _filtrele(); },
                    )),
                  ]),"""
          new = """                  TextField(
                    controller: _aramaController,
                    decoration: InputDecoration(
                      hintText: 'Belge no, cari, kasa, açıklama...',
                      prefixIcon: const Icon(Icons.search),
                      suffixIcon: _aramaController.text.isEmpty
                          ? null
                          : IconButton(onPressed: _aramaController.clear, icon: const Icon(Icons.clear)),
                      border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                    ),
                  ),
                  const SizedBox(height: 8),
                  DropdownButtonFormField<String>(
                    value: _durumFiltresi,
                    isExpanded: true,
                    decoration: const InputDecoration(labelText: 'Durum', border: OutlineInputBorder()),
                    items: const [
                      DropdownMenuItem(value: 'TÜMÜ', child: Text('Tümü')),
                      DropdownMenuItem(value: 'AKTİF', child: Text('Aktif')),
                      DropdownMenuItem(value: 'İPTAL', child: Text('İptal')),
                    ],
                    onChanged: (deger) {
                      if (deger == null) return;
                      setState(() => _durumFiltresi = deger);
                      _filtrele();
                    },
                  ),"""
          s = replace_once(s, old, new, 'makbuz mobile search')
          p.write_text(s, encoding='utf-8')

          # 4) CARİ DETAY: özet ve aksiyon alanının birbirine girmesini önle.
          p = Path('lib/screens/cariler_sayfasi.dart')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              """          content: MobilDialogIcerik(
            width: 1180,
            height: 720,""",
              """          content: MobilDialogIcerik(
            width: 1180,
            height: mobil ? MediaQuery.sizeOf(dialogContext).height * 0.50 : 720,""",
              'cari dialog mobile height',
          )
          old = """                  child: Wrap(
                    alignment: WrapAlignment.end,
                    spacing: 34,
                    runSpacing: 10,
                    children: [
                      _ekstreOzet(
                        'Toplam Borç',
                        _para(toplamBorc),
                        Colors.red.shade700,
                      ),
                      _ekstreOzet(
                        'Toplam Alacak',
                        _para(toplamAlacak),
                        Colors.green.shade700,
                      ),
                      _ekstreOzet(
                        'Son Bakiye',
                        CariEkstreService.bakiyeMetni(ekstreBakiye),
                        ekstreBakiye > 0
                            ? Colors.red.shade700
                            : ekstreBakiye < 0
                            ? Colors.green.shade700
                            : Colors.grey.shade700,
                      ),
                    ],
                  ),"""
          new = """                  child: mobil
                      ? Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            _ekstreOzet('Toplam Borç', _para(toplamBorc), Colors.red.shade700),
                            const SizedBox(height: 8),
                            _ekstreOzet('Toplam Alacak', _para(toplamAlacak), Colors.green.shade700),
                            const SizedBox(height: 8),
                            _ekstreOzet(
                              'Son Bakiye',
                              CariEkstreService.bakiyeMetni(ekstreBakiye),
                              ekstreBakiye > 0
                                  ? Colors.red.shade700
                                  : ekstreBakiye < 0
                                      ? Colors.green.shade700
                                      : Colors.grey.shade700,
                            ),
                          ],
                        )
                      : Wrap(
                          alignment: WrapAlignment.end,
                          spacing: 34,
                          runSpacing: 10,
                          children: [
                            _ekstreOzet('Toplam Borç', _para(toplamBorc), Colors.red.shade700),
                            _ekstreOzet('Toplam Alacak', _para(toplamAlacak), Colors.green.shade700),
                            _ekstreOzet(
                              'Son Bakiye',
                              CariEkstreService.bakiyeMetni(ekstreBakiye),
                              ekstreBakiye > 0
                                  ? Colors.red.shade700
                                  : ekstreBakiye < 0
                                      ? Colors.green.shade700
                                      : Colors.grey.shade700,
                            ),
                          ],
                        ),"""
          s = replace_once(s, old, new, 'cari mobile summary')
          s = replace_once(
              s,
              """          actions: [
            OutlinedButton.icon(""",
              """          actionsOverflowDirection: VerticalDirection.down,
          actionsOverflowButtonSpacing: 8,
          actions: [
            OutlinedButton.icon(""",
              'cari action overflow',
          )
          p.write_text(s, encoding='utf-8')

          # 5) SATIŞ FATURASI: mobil belge alanları tek sütun; kurumsal başlık mobilde sıkışmaz.
          p = Path('lib/screens/satis_sayfasi.dart')
          s = p.read_text(encoding='utf-8')
          start = s.index('  Widget _ustBilgiler() {')
          end = s.index('  Widget _aramaPaneli() {', start)
          new_method = r'''  Widget _ustBilgiler() {
    return Card(
      margin: const EdgeInsets.fromLTRB(8, 8, 8, 4),
      child: Padding(
        padding: const EdgeInsets.all(10),
        child: LayoutBuilder(
          builder: (context, constraints) {
            final mobil = constraints.maxWidth < 720;
            double alan(double masaustu) => mobil ? constraints.maxWidth : masaustu;

            return Wrap(
              spacing: 10,
              runSpacing: 10,
              children: [
                SizedBox(
                  width: alan(300),
                  child: InkWell(
                    onTap: _irsaliyeAktarModu
                        ? null
                        : () async {
                            final secilen = await CariSecDialog.ac(
                              context: context,
                              cariler: _cariler,
                              seciliCariId: _cariId,
                              baslik: 'Satış Cari / Müşteri Seç',
                              aramaIpucu: 'Cari ünvanı ara...',
                            );
                            if (secilen == null || !mounted) return;
                            setState(() => _cariId = secilen);
                          },
                    child: InputDecorator(
                      decoration: InputDecoration(
