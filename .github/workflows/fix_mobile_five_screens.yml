                      child: Text(depo['depo_adi']?.toString() ?? '', overflow: TextOverflow.ellipsis),
                    )).toList(),
                    onChanged: _irsaliyeAktarModu ? null : (deger) => setState(() => _depoId = deger),
                  ),
