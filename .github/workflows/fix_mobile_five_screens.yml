                      ),
                      child: Text(
                        _seciliCariAdi(),
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                      ),
                    ),
                  ),
                ),
                SizedBox(
                  width: alan(180),
                  child: DropdownButtonFormField<int>(
                    isExpanded: true,
