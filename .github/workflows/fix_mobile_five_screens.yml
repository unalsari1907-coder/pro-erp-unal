name: Fix five mobile ERP screens

on:
  push:
    paths:
      - '.github/workflows/fix_mobile_five_screens.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile layout fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label}')
              return text.replace(old, new, 1)

          # 1) KASA GÜN SONU: dar ekranda sistem bakiyesi + buton aynı satırda sıkışmasın.
          p = Path('lib/screens/kasa_gun_sonu_sayfasi.dart')
          s = p.read_text(encoding='utf-8')
          old = """                              Row(children: [
                                Expanded(child: Text('Sistem: ${_para(beklenen)}', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold))),
                                const SizedBox(width: 8),
                                OutlinedButton.icon(onPressed: () => _sayimKaydet(kasa), icon: const Icon(Icons.fact_check_rounded), label: Text(kayit == null ? 'Sayım Yap' : 'Düzelt')),
                              ]),"""
          new = """                              Text(
                                'Sistem: ${_para(beklenen)}',
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                style: const TextStyle(fontWeight: FontWeight.bold),
                              ),
                              const SizedBox(height: 8),
                              SizedBox(
                                width: double.infinity,
                                child: OutlinedButton.icon(
                                  onPressed: () => _sayimKaydet(kasa),
                                  icon: const Icon(Icons.fact_check_rounded),
                                  label: Text(kayit == null ? 'Sayım Yap' : 'Düzelt'),
                                ),
                              ),"""
          s = replace_once(s, old, new, 'kasa mobile footer')
          p.write_text(s, encoding='utf-8')

          # 2) STOK SAYIMI: ürün bilgisi ve miktar alanları telefonda hiçbir koşulda dar sütuna sıkışmasın.
          p = Path('lib/screens/sayim_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = """                                        Expanded(
                                          child: Column(
                                            crossAxisAlignment: CrossAxisAlignment.start,
                                            children: [
                                              Text(_metin(item['urun_adi']), maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold)),
                                              const SizedBox(height: 4),
                                              Text('ÜRETİCİ KODU: ${_metin(item['uretici_kodu'])}', maxLines: 1, overflow: TextOverflow.ellipsis),
                                              Text('RAF: ${_metin(item['raf'])}', maxLines: 1, overflow: TextOverflow.ellipsis),
                                            ],
                                          ),
                                        ),"""
          new = """                                        Expanded(
                                          child: SizedBox(
                                            width: double.infinity,
                                            child: Column(
                                              crossAxisAlignment: CrossAxisAlignment.start,
                                              children: [
                                                Text(
                                                  _metin(item['urun_adi']),
                                                  maxLines: 3,
                                                  softWrap: true,
                                                  overflow: TextOverflow.ellipsis,
                                                  style: const TextStyle(fontWeight: FontWeight.bold),
                                                ),
                                                const SizedBox(height: 4),
                                                Text(
                                                  'ÜRETİCİ KODU: ${_metin(item['uretici_kodu'])}',
                                                  maxLines: 2,
                                                  softWrap: true,
                                                  overflow: TextOverflow.ellipsis,
                                                ),
                                                Text(
                                                  'RAF: ${_metin(item['raf'])}',
                                                  maxLines: 1,
                                                  overflow: TextOverflow.ellipsis,
                                                ),
                                              ],
                                            ),
                                          ),
                                        ),"""
          s = replace_once(s, old, new, 'sayim product info')
          old = """                                    Row(
                                      children: [
                                        Expanded(
                                          child: Container(
                                            padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
                                            decoration: BoxDecoration(color: Colors.blueGrey.withOpacity(.06), borderRadius: BorderRadius.circular(8)),
                                            child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                                              const Text('Sistem', style: TextStyle(color: Colors.grey, fontSize: 11)),
                                              Text(_miktar(sistem), style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                                            ]),
                                          ),
                                        ),
                                        const SizedBox(width: 10),
                                        Expanded(
                                          child: TextField(
                                            controller: controller,
                                            textAlign: TextAlign.right,
                                            keyboardType: const TextInputType.numberWithOptions(decimal: true),
                                            decoration: const InputDecoration(labelText: 'Sayılan', border: OutlineInputBorder(), isDense: true),
                                          ),
                                        ),
                                      ],
                                    ),"""
          new = """                                    LayoutBuilder(
                                      builder: (context, constraints) {
                                        final cokDar = constraints.maxWidth < 330;
                                        final sistemKutusu = Container(
                                          width: double.infinity,
                                          padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
                                          decoration: BoxDecoration(
                                            color: Colors.blueGrey.withOpacity(.06),
                                            borderRadius: BorderRadius.circular(8),
                                          ),
                                          child: Column(
                                            crossAxisAlignment: CrossAxisAlignment.start,
                                            children: [
                                              const Text('Sistem', style: TextStyle(color: Colors.grey, fontSize: 11)),
                                              Text(_miktar(sistem), style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                                            ],
                                          ),
                                        );
                                        final sayilanAlani = TextField(
                                          controller: controller,
                                          textAlign: TextAlign.right,
                                          keyboardType: const TextInputType.numberWithOptions(decimal: true),
                                          decoration: const InputDecoration(
                                            labelText: 'Sayılan',
                                            border: OutlineInputBorder(),
                                            isDense: true,
                                          ),
                                        );
                                        if (cokDar) {
                                          return Column(
                                            children: [
                                              sistemKutusu,
                                              const SizedBox(height: 8),
                                              sayilanAlani,
                                            ],
                                          );
                                        }
                                        return Row(
                                          children: [
                                            Expanded(child: sistemKutusu),
                                            const SizedBox(width: 10),
                                            Expanded(child: sayilanAlani),
                                          ],
                                        );
                                      },
                                    ),"""
          s = replace_once(s, old, new, 'sayim quantities')
          p.write_text(s, encoding='utf-8')

          # 3) MAKBUZLAR: mobil sekmeler ve arama/durum alanı tam genişlikte alt alta.
          p = Path('lib/screens/makbuzlar_sayfasi.dart')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              """                        ButtonSegment<String>(value: 'TAHSILAT', icon: Icon(Icons.south_west), label: Text('Tahsilat')),
                        ButtonSegment<String>(value: 'ODEME', icon: Icon(Icons.north_east), label: Text('Ödeme')),""",
              """                        ButtonSegment<String>(value: 'TAHSILAT', label: Text('Tahsilat')),
                        ButtonSegment<String>(value: 'ODEME', label: Text('Ödeme')),""",
              'makbuz mobile segments',
          )
          old = """                  Row(children: [
                    Expanded(child: TextField(
                      controller: _aramaController,
