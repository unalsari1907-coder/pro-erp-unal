name: Belge olusturma ekranlarini ERP sekmelerine bagla

on:
  push:
    paths:
      - '.github/workflows/apply_document_tabs_2533.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Belge ekranlarini sekme sistemine bagla
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Kalip bulunamadi: {path} -> {old[:80]!r}')
              s = s.replace(old, new, count)
              p.write_text(s, encoding='utf-8')

          # Dashboard: servis ve yeni belge ekranlari.
          p = Path('lib/screens/dashboard_sayfasi.dart')
          s = p.read_text(encoding='utf-8')
          if "../services/erp_sekme_service.dart" not in s:
              s = s.replace("import '../services/doviz_kur_service.dart';", "import '../services/doviz_kur_service.dart';\nimport '../services/erp_sekme_service.dart';")
          for imp in [
              "import 'yeni_satis_irsaliyesi_screen.dart';",
              "import 'yeni_alis_irsaliyesi_screen.dart';",
              "import 'yeni_siparis_screen.dart';",
              "import 'yeni_alis_siparis_screen.dart';",
              "import 'satin_alma/satin_alma_sayfasi.dart';",
          ]:
              if imp not in s:
                  s = s.replace("import 'satis_faturalari_sayfasi.dart';", "import 'satis_faturalari_sayfasi.dart';\n" + imp, 1)

          init_old = """    super.initState();\n\n    _menuAramaController.addListener(() {"""
          init_new = """    super.initState();\n\n    ErpSekmeService.bagla((sayfaId) {\n      _sayfaSec(sayfaId);\n    });\n\n    _menuAramaController.addListener(() {"""
          if "ErpSekmeService.bagla" not in s:
              if init_old not in s: raise SystemExit('dashboard initState kalibi bulunamadi')
              s = s.replace(init_old, init_new, 1)

          cases_anchor = """      case 'satis_faturalari':\n        return const SatisFaturalariSayfasi();"""
          cases_new = """      case 'yeni_satis_faturasi':\n        return const SatisSayfasi();\n      case 'yeni_alis_faturasi':\n        return const SatinAlmaSayfasi();\n      case 'yeni_satis_siparisi':\n        return const YeniSiparisScreen(kayitSonrasiKapat: false);\n      case 'yeni_alis_siparisi':\n        return const YeniAlisSiparisScreen(kayitSonrasiKapat: false);\n      case 'yeni_satis_irsaliyesi':\n        return const YeniSatisIrsaliyesiScreen(kayitSonrasiKapat: false);\n      case 'yeni_alis_irsaliyesi':\n        return const YeniAlisIrsaliyesiScreen(kayitSonrasiKapat: false);\n\n      case 'satis_faturalari':\n        return const SatisFaturalariSayfasi();"""
          if "case 'yeni_satis_faturasi':" not in s:
              if cases_anchor not in s: raise SystemExit('dashboard switch kalibi bulunamadi')
              s = s.replace(cases_anchor, cases_new, 1)

          title_anchor = """      'satis_faturalari': 'Satış Faturaları',"""
          title_new = """      'yeni_satis_faturasi': 'Yeni Satış Faturası',\n      'yeni_alis_faturasi': 'Yeni Alış Faturası',\n      'yeni_satis_siparisi': 'Yeni Satış Siparişi',\n      'yeni_alis_siparisi': 'Yeni Alış Siparişi',\n      'yeni_satis_irsaliyesi': 'Yeni Satış İrsaliyesi',\n      'yeni_alis_irsaliyesi': 'Yeni Alış İrsaliyesi',\n      'satis_faturalari': 'Satış Faturaları',"""
          if "'yeni_satis_faturasi': 'Yeni Satış Faturası'" not in s:
              if title_anchor not in s: raise SystemExit('dashboard baslik kalibi bulunamadi')
              s = s.replace(title_anchor, title_new, 1)
          p.write_text(s, encoding='utf-8')

          # Liste ekranlarinda Yeni butonu artik dashboard sekmesi acar.
          files = [
            ('lib/screens/satis_irsaliyeleri_screen.dart', "import '../services/supabase_service.dart';", "import '../services/supabase_service.dart';\nimport '../services/erp_sekme_service.dart';", "  Future<void> _yeniIrsaliyeAc() async {", "yeni_satis_irsaliyesi"),
            ('lib/screens/alis_irsaliyeleri_screen.dart', "import '../services/supabase_service.dart';", "import '../services/supabase_service.dart';\nimport '../services/erp_sekme_service.dart';", "  Future<void> _yeniIrsaliyeAc() async {", "yeni_alis_irsaliyesi"),
            ('lib/screens/siparisler_screen.dart', "import '../services/supabase_service.dart';", "import '../services/supabase_service.dart';\nimport '../services/erp_sekme_service.dart';", "  Future<void> _yeniKayitAc() async {", "yeni_satis_siparisi"),
            ('lib/screens/alis_siparisleri_screen.dart', "import '../services/supabase_service.dart';", "import '../services/supabase_service.dart';\nimport '../services/erp_sekme_service.dart';", "  Future<void> _yeniKayitAc() async {", "yeni_alis_siparisi"),
            ('lib/screens/satis_faturalari_sayfasi.dart', "import '../services/supabase_service.dart';", "import '../services/supabase_service.dart';\nimport '../services/erp_sekme_service.dart';", "  Future<void> _yeniKayitAc() async {", "yeni_satis_faturasi"),
            ('lib/screens/alis_faturalari_sayfasi.dart', "import '../services/supabase_service.dart';", "import '../services/supabase_service.dart';\nimport '../services/erp_sekme_service.dart';", "  Future<void> _yeniKayitAc() async {", "yeni_alis_faturasi"),
          ]
          for path, imp_old, imp_new, method_anchor, page_id in files:
              p = Path(path); s = p.read_text(encoding='utf-8')
              if "../services/erp_sekme_service.dart" not in s:
                  if imp_old not in s: raise SystemExit(f'import kalibi bulunamadi: {path}')
                  s = s.replace(imp_old, imp_new, 1)
              guard = f"    if (ErpSekmeService.hazir) {{\n      ErpSekmeService.ac('{page_id}');\n      return;\n    }}\n"
              marker = method_anchor + "\n" + guard
              if guard not in s:
                  if method_anchor not in s: raise SystemExit(f'method kalibi bulunamadi: {path}')
                  s = s.replace(method_anchor, marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Dart format
        run: dart format lib/screens/dashboard_sayfasi.dart lib/screens/satis_irsaliyeleri_screen.dart lib/screens/alis_irsaliyeleri_screen.dart lib/screens/siparisler_screen.dart lib/screens/alis_siparisleri_screen.dart lib/screens/satis_faturalari_sayfasi.dart lib/screens/alis_faturalari_sayfasi.dart lib/services/erp_sekme_service.dart

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens lib/services/erp_sekme_service.dart
          git diff --cached --quiet && exit 0
          git commit -m "Alis satis belge ekranlarini kalici ERP sekmelerine bagla"
          git push origin HEAD:main
