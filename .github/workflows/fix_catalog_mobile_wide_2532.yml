name: Mobil arac katalog gorunumunu genislet

on:
  push:
    paths:
      - '.github/workflows/fix_catalog_mobile_wide_2532.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mobil katalog alanini genislet
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/screens/arac_parca_katalog_sayfasi.dart')
          s = p.read_text(encoding='utf-8')

          old = """      body: Padding(\n        padding: const EdgeInsets.all(14),"""
          new = """      body: Padding(\n        padding: EdgeInsets.symmetric(\n          horizontal: mobil ? 8 : 14,\n          vertical: mobil ? 8 : 14,\n        ),"""
          if old not in s:
              raise SystemExit('Ana mobil padding kalibi bulunamadi')
          s = s.replace(old, new, 1)

          old = """    final mobil = MediaQuery.sizeOf(context).width < 1000;"""
          new = """    final ekranGenisligi = MediaQuery.sizeOf(context).width;\n    final mobil = ekranGenisligi < 1000;\n    final cokDarMobil = ekranGenisligi < 520;"""
          if old not in s:
              raise SystemExit('Parca paneli mobil kalibi bulunamadi')
          s = s.replace(old, new, 1)

          old = """          child: Padding(\n            padding: const EdgeInsets.all(14),\n            child: Wrap(\n              spacing: 24,\n              runSpacing: 8,"""
          new = """          child: Padding(\n            padding: EdgeInsets.symmetric(\n              horizontal: mobil ? 14 : 14,\n              vertical: mobil ? 16 : 14,\n            ),\n            child: Wrap(\n              spacing: mobil ? 16 : 24,\n              runSpacing: mobil ? 16 : 8,"""
          if old not in s:
              raise SystemExit('Arac bilgi karti kalibi bulunamadi')
          s = s.replace(old, new, 1)

          old = """                _bilgi('Araç', '${_s(arac['uretici'])} ${_s(arac['model'])}'),"""
          new = """                SizedBox(\n                  width: mobil ? (cokDarMobil ? 145 : 190) : 190,\n                  child: _bilgi('Araç', '${_s(arac['uretici'])} ${_s(arac['model'])}'),\n                ),"""
          if old not in s:
              raise SystemExit('Arac bilgi alani bulunamadi')
          s = s.replace(old, new, 1)

          old = """                if (_s(arac['notlar']).isNotEmpty)\n                  SizedBox(\n                    width: mobil ? double.infinity : 520,"""
          new = """                if (_s(arac['notlar']).isNotEmpty)\n                  SizedBox(\n                    width: mobil ? (cokDarMobil ? 160 : 260) : 520,"""
          if old not in s:
              raise SystemExit('Not alani kalibi bulunamadi')
          s = s.replace(old, new, 1)

          old = """                    SizedBox(\n                      height: 54,"""
          new = """                    SizedBox(\n                      height: 58,"""
          if old not in s:
              raise SystemExit('Kategori seridi kalibi bulunamadi')
          s = s.replace(old, new, 1)

          old = """                  padding: const EdgeInsets.symmetric(\n                    horizontal: 16,\n                    vertical: 12,\n                  ),"""
          new = """                  padding: EdgeInsets.symmetric(\n                    horizontal: mobil ? 10 : 16,\n                    vertical: mobil ? 10 : 12,\n                  ),"""
          if old not in s:
              raise SystemExit('Parca kart padding kalibi bulunamadi')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/arac_parca_katalog_sayfasi.dart
          git diff --cached --quiet && exit 0
          git commit -m "Mobil arac katalog alanini genislet"
          git push
