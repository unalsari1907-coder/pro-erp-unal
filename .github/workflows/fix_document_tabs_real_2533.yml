name: Belge ekranlarini GERCEK ERP sekmelerine duzelt
on:
  push:
    paths: ['.github/workflows/fix_document_tabs_real_2533.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: python
        run: |
          from pathlib import Path

          d=Path('lib/screens/dashboard_sayfasi.dart')
          s=d.read_text(encoding='utf-8')
          if "../services/erp_sekme_service.dart" not in s:
            s=s.replace("import '../services/doviz_kur_service.dart';", "import '../services/doviz_kur_service.dart';\nimport '../services/erp_sekme_service.dart';")
          extra="""import 'yeni_satis_irsaliyesi_screen.dart';
import 'yeni_alis_irsaliyesi_screen.dart';
import 'yeni_siparis_screen.dart';
import 'yeni_alis_siparis_screen.dart';
import 'satin_alma/satin_alma_sayfasi.dart';
"""
          if "import 'yeni_satis_irsaliyesi_screen.dart';" not in s:
            s=s.replace("import 'satis_irsaliyeleri_screen.dart';", "import 'satis_irsaliyeleri_screen.dart';\n"+extra)
          if 'ErpSekmeService.bagla' not in s:
            needle='''  void initState() {\n    super.initState();'''
            if needle not in s: raise SystemExit('initState bulunamadi')
            s=s.replace(needle, needle+"\n    ErpSekmeService.bagla((sayfaId) => _sayfaSec(sayfaId));",1)
          if "case 'yeni_satis_irsaliyesi':" not in s:
            needle="""      case 'satis_faturalari':\n        return const SatisFaturalariSayfasi();"""
            add="""      case 'yeni_satis_faturasi':
        return const SatisSayfasi();
      case 'yeni_alis_faturasi':
        return const SatinAlmaSayfasi();
      case 'yeni_satis_siparisi':
        return const YeniSiparisScreen(kayitSonrasiKapat: false);
      case 'yeni_alis_siparisi':
        return const YeniAlisSiparisScreen(kayitSonrasiKapat: false);
      case 'yeni_satis_irsaliyesi':
        return const YeniSatisIrsaliyesiScreen(kayitSonrasiKapat: false);
      case 'yeni_alis_irsaliyesi':
        return const YeniAlisIrsaliyesiScreen(kayitSonrasiKapat: false);

"""+needle
            if needle not in s: raise SystemExit('switch bulunamadi')
            s=s.replace(needle,add,1)
          if "'yeni_satis_irsaliyesi': 'Yeni Satış İrsaliyesi'" not in s:
            needle="      'satis_faturalari': 'Satış Faturaları',"
            add="""      'yeni_satis_faturasi': 'Yeni Satış Faturası',
      'yeni_alis_faturasi': 'Yeni Alış Faturası',
      'yeni_satis_siparisi': 'Yeni Satış Siparişi',
      'yeni_alis_siparisi': 'Yeni Alış Siparişi',
      'yeni_satis_irsaliyesi': 'Yeni Satış İrsaliyesi',
      'yeni_alis_irsaliyesi': 'Yeni Alış İrsaliyesi',
"""+needle
            if needle not in s: raise SystemExit('baslik bulunamadi')
            s=s.replace(needle,add,1)
          d.write_text(s,encoding='utf-8')

          specs=[
            ('lib/screens/satis_irsaliyeleri_screen.dart','_yeniIrsaliyeAc','yeni_satis_irsaliyesi'),
            ('lib/screens/alis_irsaliyeleri_screen.dart','_yeniIrsaliyeAc','yeni_alis_irsaliyesi'),
            ('lib/screens/siparisler_screen.dart','_yeniKayitAc','yeni_satis_siparisi'),
            ('lib/screens/alis_siparisleri_screen.dart','_yeniKayitAc','yeni_alis_siparisi'),
            ('lib/screens/satis_faturalari_sayfasi.dart','_yeniKayitAc','yeni_satis_faturasi'),
            ('lib/screens/alis_faturalari_sayfasi.dart','_yeniKayitAc','yeni_alis_faturasi'),
          ]
          for fn,method,page in specs:
            p=Path(fn); x=p.read_text(encoding='utf-8')
            if "../services/erp_sekme_service.dart" not in x:
              # insert after material import, independent of existing import ordering
              marker="import 'package:flutter/material.dart';"
              if marker not in x: raise SystemExit(f'material import yok {fn}')
              x=x.replace(marker,marker+"\nimport '../services/erp_sekme_service.dart';",1)
            guard=f"    if (ErpSekmeService.hazir) {{\n      ErpSekmeService.ac('{page}');\n      return;\n    }}\n"
            if guard not in x:
              import re
              pat=rf'(Future<void>\s+{re.escape(method)}\(\)\s+async\s*\{{\n)'
              x,n=re.subn(pat,lambda m:m.group(1)+guard,x,count=1)
              if n!=1: raise SystemExit(f'method yok {fn} {method}')
            p.write_text(x,encoding='utf-8')
      - name: Format
        run: dart format lib/screens/dashboard_sayfasi.dart lib/screens/satis_irsaliyeleri_screen.dart lib/screens/alis_irsaliyeleri_screen.dart lib/screens/siparisler_screen.dart lib/screens/alis_siparisleri_screen.dart lib/screens/satis_faturalari_sayfasi.dart lib/screens/alis_faturalari_sayfasi.dart
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens
          git diff --cached --quiet && { echo 'Degisiklik yok'; exit 1; }
          git commit -m "Belge olusturma ekranlarini gercek ERP sekmelerine bagla"
          git push origin HEAD:main
