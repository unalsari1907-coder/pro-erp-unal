name: Fix vehicle plate save v2

on:
  push:
    paths:
      - '.github/workflows/fix_vehicle_plate_save_v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch edit save call only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/screens/arac_parca_katalog_sayfasi.dart')
          s = p.read_text(encoding='utf-8')
          marker = '  Future<void> _aracDetayDuzenle() async {'
          if marker not in s:
              raise SystemExit('Edit method marker not found')
          left, right = s.split(marker, 1)
          old = """        motorKodu: motorKodu.text,\n        sase: sase.text,\n        notlar: notlar.text,\n        aracSahibi: sahip.text,"""
          new = """        motorKodu: motorKodu.text,\n        sase: sase.text,\n        plaka: plaka.text,\n        notlar: notlar.text,\n        aracSahibi: sahip.text,"""
          if old in right:
              right = right.replace(old, new, 1)
          elif new not in right:
              raise SystemExit('Expected edit save call pattern not found')
          s = left + marker + right
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/arac_parca_katalog_sayfasi.dart
          if git diff --cached --quiet; then
            echo "Plate save already fixed."
            exit 0
          fi
          git commit -m "Fix plate parameter in vehicle edit save"
          git push origin HEAD:main
