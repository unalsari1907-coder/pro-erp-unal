name: Alis irsaliyesinde miktar ve fiyati birlikte duzenle

on:
  push:
    paths:
      - '.github/workflows/fix_alis_irsaliye_miktar_fiyat_2534.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Miktar ve fiyat duzenleme penceresini guncelle
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/screens/yeni_alis_irsaliyesi_screen.dart')
          s = p.read_text(encoding='utf-8')

          start = s.index('  Future<void> _alisFiyatiDegistir(int index) async {')
          end = s.index('  Future<void> _kaydet() async {', start)

          yeni = '''  Future<void> _alisFiyatiDegistir(int index) async {
    final item = _sepet[index];

    final miktarController = TextEditingController(
      text: _sayi(item['miktar']).toStringAsFixed(0),
    );
    final fiyatController = TextEditingController(
      text: _sayi(item['birim_fiyat']).toStringAsFixed(2),
    );

    final sonuc = await showDialog<Map<String, double>>(
      context: context,
      builder: (dialogContext) {
        return AlertDialog(
          title: const Text('Miktar / AFN Alış Fiyatını Değiştir'),
          content: SizedBox(
            width: 360,
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                TextField(
                  controller: miktarController,
                  autofocus: true,
                  keyboardType: const TextInputType.numberWithOptions(decimal: true),
                  decoration: const InputDecoration(
                    labelText: 'Miktar / Adet',
                    suffixText: 'Adet',
                    border: OutlineInputBorder(),
                  ),
                ),
                const SizedBox(height: 14),
                TextField(
                  controller: fiyatController,
                  keyboardType: const TextInputType.numberWithOptions(decimal: true),
                  decoration: const InputDecoration(
                    labelText: 'Birim Alış Fiyatı',
                    suffixText: '₺',
                    border: OutlineInputBorder(),
                  ),
                  onSubmitted: (_) {
                    Navigator.pop(dialogContext, {
                      'miktar': _sayi(miktarController.text),
                      'fiyat': _sayi(fiyatController.text),
                    });
                  },
                ),
              ],
            ),
          ),
          actions: [
            TextButton(
              onPressed: () => Navigator.pop(dialogContext),
              child: const Text('Vazgeç'),
            ),
            ElevatedButton(
              onPressed: () {
                Navigator.pop(dialogContext, {
                  'miktar': _sayi(miktarController.text),
                  'fiyat': _sayi(fiyatController.text),
                });
              },
              child: const Text('Uygula'),
            ),
          ],
        );
      },
    );

    miktarController.dispose();
    fiyatController.dispose();

    if (sonuc == null) return;

    final yeniMiktar = sonuc['miktar'] ?? 0;
    final yeniFiyat = sonuc['fiyat'] ?? 0;

    if (yeniMiktar <= 0) {
      _mesaj('Miktar sıfırdan büyük olmalıdır.', Colors.orange);
      return;
    }

    if (yeniFiyat < 0) {
      _mesaj('Alış fiyatı negatif olamaz.', Colors.orange);
      return;
    }

    setState(() {
      _sepet[index]['miktar'] = yeniMiktar;
      _sepet[index]['fiyat_tipi'] = 'AFN';
      _sepet[index]['birim_fiyat'] = yeniFiyat;
    });
  }

'''

          s = s[:start] + yeni + s[end:]
          p.write_text(s, encoding='utf-8')

          kontrol = p.read_text(encoding='utf-8')
          assert "labelText: 'Miktar / Adet'" in kontrol
          assert "_sepet[index]['miktar'] = yeniMiktar;" in kontrol
          assert "_sepet[index]['birim_fiyat'] = yeniFiyat;" in kontrol

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/yeni_alis_irsaliyesi_screen.dart
          git diff --cached --check
          git commit -m 'Alis irsaliyesinde miktar ve fiyati birlikte duzenle'
          git push origin HEAD:main
