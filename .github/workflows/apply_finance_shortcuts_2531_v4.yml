name: Apply PRO ERP 2.5.31 finance and shortcuts v4

on:
  push:
    paths:
      - '.github/workflows/apply_finance_shortcuts_2531_v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply finance and keyboard patch
        run: python3 .github/scripts/apply_finance_shortcuts_2531.py
      - name: Commit changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/kasa_banka_sayfasi.dart lib/screens/dashboard_sayfasi.dart supabase/PRO_ERP_FINANS_KK_LIMIT_2_5_31.sql
          if git diff --cached --quiet; then
            echo "Already applied."
            exit 0
          fi
          git commit -m "Apply PRO ERP 2.5.31 finance and keyboard improvements"
          git push origin HEAD:main
