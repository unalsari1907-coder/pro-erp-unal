name: Fix vehicle plate save

on:
  push:
    paths:
      - '.github/workflows/fix_vehicle_plate_save.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch missing plate parameter
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/screens/arac_parca_katalog_sayfasi.dart')
          s = p.read_text(encoding='utf-8')
          old = """        motorKodu: motorKodu.text,\n        sase: sase.text,\n        notlar: notlar.text,\n        aracSahibi: sahip.text,"""
          new = """        motorKodu: motorKodu.text,\n        sase: sase.text,\n        plaka: plaka.text,\n        notlar: notlar.text,\n        aracSahibi: sahip.text,"""
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected aracGuncelle call pattern not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/arac_parca_katalog_sayfasi.dart
          if git diff --cached --quiet; then
            echo "Plate save fix already applied."
            exit 0
          fi
          git commit -m "Fix vehicle plate save from catalog edit dialog"
          git push origin HEAD:main
